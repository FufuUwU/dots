# Moon palette, matches ~/.config/sway/moon
[main]
font=JetBrainsMono Nerd Font:size=12
terminal=kitty -e
prompt="❯ "
icon-theme=Adwaita
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=8
layer=overlay

[colors]
background=080C1CD9
text=DBE2F2ff
prompt=90CDF6ff
placeholder=4A5A85ff
input=DBE2F2ff
match=E2C98Aff
selection=90CDF6ff
selection-text=080C1Cff
selection-match=4A1A35ff
border=90CDF6ff

[border]
width=2
radius=16
